  pros:
  - Conventional topology with permissively licensed base
  - Retains 355 mm nominal reach
  cons:
  - Many belt stages and unverified running torque
  - MG90S contact and direct-roll eccentricity unresolved
  - Cost range crosses $100
  status: unselected_conditional_screen_only
- id: arm-600g-B
  label: B — Base-driven parallelogram
  title: B — Base-driven parallelogram
  description: Original equal-crank linkage with Moveo-derived supports (MIT). Shoulder
    and absolute forearm elevation driven at yaw platform; local wrist roll retained.
    Estimated radial zone 145–335 mm, 0.843 kg moving. Estimated $91–141. Lower shoulder
    drive torque than A, but reduced reach and more alignment work.
  image: research/concepts-600g/options.svg
  evidence:
