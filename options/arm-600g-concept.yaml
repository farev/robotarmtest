- id: arm-600g-C
  label: C — Dead-load counterbalanced arm
  title: C — Dead-load counterbalanced arm
  description: Moveo-derived serial arm (MIT), with two adjustable rear counterweights.
    355 mm nominal reach; 1.613 kg moving estimate, including 0.830 kg effective ballast
    assemblies. Estimated $90–140. Balances arm dead weight, not payload; rear sweep
    and inertia increase.
