id: arm-600g-concept
prompt: Choose a concept to develop for the 600 g arm. A is the conventional first
  option; A and B are the proposed CAD/simulation comparison pair, with C available
  if you prefer counterweights. No new CAD until your pick. All retain four owned
  motors, wrist roll, MG90S, black finish, X1E fit target and PETG exceptions. Grip,
  exact motor/step-rate capability and delivered cost below $100 remain unverified;
  choosing a concept does not approve fabrication or a budget increase.
options:
- id: arm-600g-A
  label: A — Conventional articulated belt arm
  title: A — Conventional articulated belt arm
  description: Moveo-derived supported serial arm (BCN3D, MIT). Three motors at base/yaw
    platform; one local wrist-roll motor. 355 mm nominal reach, 0.783 kg pitch-moving
    mass estimate. Estimated $82–127; budget compliance unverified.
  image: research/concepts-600g/options.svg
  evidence:
  - research/concepts-600g/note.md
  - research/arm-baseline/note.md
  - research/payload-600g/note.md
