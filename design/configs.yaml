unresolved_mappings:
- 'Material count conflict: decisions/digest/build plan say 4 motor-clamping parts;
  print list and assembly explicitly assign PETG to 5: base-deck, upper-arm, pack-cover,
  pack-carriage, forearm. Preserve these 5 manifest picks; do not certify heat performance.'
- Historical deadline decision permits PLA everywhere at 0.6 A; compatibility.yaml
  instead discusses 0.7 A. Neither is a validated thermal/current prescription at
  0.6 kg.
- build_plan.md and compatibility torque calculations use 100 g; superseded by requested
  600 g. No capacity approval or new concept selection.
- Composite uno-cnc-shield model maps both controller and shield; drivers/capacitor
  and multiple electrical items lack discrete assembly instances.
- Pulley kit must cover 4 x 20T, 1 x 60T and 2 x 200 mm belts; kit purchase quantity
  is 2, not installed quantity. 60T and belt-s1/s2 models need explicit kit mapping.
- Elbow rod model is 8x113; manifest 8 mm rod model is 8x100. Both cuts are stated
  in build plan; no unique model match for elbow.
- 'Fasteners are partly modelled and partly grouped: source says about 57 M3 screws;
  full per-size counts unresolved. M3 washer count conflicts: components 8, build
  plan 4.'
- 'Homing switches: 3 specified but no models, mounting geometry or sourced selection.
  Optional cable routing/tool choices are unresolved, represented by null picks.'
- Old build plan panel jack and 16 mm switch are superseded by supplied adapter and
  22 mm mushroom; DC interrupt rating and fuse rating remain unverified. 7.5 A fuse
  is recorded from plan, not safety approval.
- Motor exact datasheet/body/shaft dimensions and MG90S clone fit remain unverified;
  preserve component notes and compatibility statuses without upgrading them.
- 520 mm elbow belt is v1. Documented 500 mm fallback requires L2=0.125 m; not interchangeable
  without geometry change and not selected.
- 'No complete current cost total: component order subtotals USD 83.10 + 5.50 exclude
  unresolved local items; prices are historical, not checked. Under USD 100 remaining
  budget is unverified.'
- Keepout geometry is excluded from swappable physical inventory. Print coupons are
  included. built records design intent only, not fabricated stock.
- No registry schema or configuration tool exposed in available tools; this is an
  explicit YAML inventory schema. Viewer integration is not verified.
- Licences of reused designs are not identified in allowed inputs; no new designs
  imported.
source_compatibility: parts/compatibility.yaml; claims preserved as historical evidence
  only
