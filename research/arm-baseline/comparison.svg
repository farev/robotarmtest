<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>600 g arm concept comparison</title><desc>Original non-scale mechanism sketches. Three proposals, none selected or verified for capacity.</desc>
