note: >
  Uno outline (with the right-edge chamfers and 1 mm rounded corners), the 4 holes (3.2 dia),
  header positions (IOH 17.5..42.9, IOL 44.5..64.8 on y=50.8; POWER 26.7..47.0, AD 49.5..64.8 on
  y=2.54) and the USB-B / DC jack placements are exact from the official Arduino Eagle file;
  connector HEIGHTS and widths are not in that file and are standard-part estimates (USB-B 12.0 x
  10.9, barrel jack 9.0 x 11.0). USB-B spans y 32.1..44.1, x -6.34..9.41; DC jack spans y
  3.30..12.30, x -1.80..11.68. The jack top (z=12.6) equals the modelled shield underside: on real
  stacks the jack/USB top can touch the shield, so leave clearance for tape or a shield offset.
  The shield: no Protoneer-published V3.xx drawing was found (blog.protoneer.co.nz unreachable); the
  shield is modelled with the Uno outline (retail listings say 68-69 x 53-54 mm) and driver sockets
  (module centres x 23.5/45.6, y 15.9/36.2, long axis along Y, pin rows 12.7 apart along X) and
  the 2-pin 5.08 mm VMOT terminal taken from the open StaticBoards CNC shield KiCad layout, which
  reproduces the Protoneer arrangement; actual clones can differ by 1 mm or more. Heights of
  sockets (8.5), male-header plastic (2.5), A4988 module (15.24 x 20.32 x 1.6), chip (1.0) and
  9x9x5 heatsinks are estimates; heatsink centred on the module, not on the true chip position.
  Driver axis labels (X/Y/Z/A) are not modelled. Shield mounting holes, pins below the PCBs,
  electrolytic caps, microstep jumpers, motor headers and the pot are not modelled.
