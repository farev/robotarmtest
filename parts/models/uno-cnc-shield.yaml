  components toward +Z). X along the 68.58 mm edge, Y along the 53.34 mm edge (Arduino Eagle board
  coordinates, same orientation as the official board file: USB-B at upper left, DC jack at lower
  left, header rows IOH/IOL on the y=50.8 edge, POWER/AD headers on the y=2.54 edge). USB-B and DC
  jack are on the x=0 edge and overhang to negative x. The shield sits above the Uno, drivers above
  the shield, tallest point is the heatsinks.
