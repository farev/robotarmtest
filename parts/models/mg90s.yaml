note: >-
  Built from the TowerPro product table (A 32.5 total height, B 22.8, C 28.4, D 12.4, E 32.1, F 18.5), the TowerPro
  diagram and, for what TowerPro does not publish, the Hitec HS-5055MG drawing (same 9g footprint) and the Kuman MG90S
  OpenSCAD model (christophevg/3d-servo-model, hole pitch 28.6, tab underside 18.3, wing 2.8, case 22.5, boss top ~28.46).
  Interpretation of letters: A/C are heights to spline top / gear-boss top, F is the tab UNDERSIDE (diagram reference
  line sits on the tab's lower edge and Kuman agrees); if a caliper shows the tab top at 18.5 instead, tab top height
  is 18.5 and body height likely 22.5 still. Tab holes are drawn as slotted keyholes on the TowerPro diagram; modelled
  as plain round holes. Second gear boss (dia 6, centre x -6.4, same top height as the main boss) and the bridge
  between them are estimated from the diagram. Spline modelled as a plain cylinder (21T teeth, 4.8 mm OD).
  Cable: leaves the +X (shaft) end face at the bottom per the TowerPro and Hitec drawings; keep-out block 10 x 6 x 4 mm
  is an estimate. Clones vary by up to ~0.5 mm; leave >= 0.5 mm clearance per side in printed pockets. Re-measure with
  calipers when the servo arrives (tab top height, case top height, tab thickness, hole pitch, cable end).
